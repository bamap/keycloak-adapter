# Test configuration for SAM service adapter
# Loads from environment variable SAM_SERVICE_URL or defaults to localhost:8081
keycloak.service.url=http://localhost:8181/realms/Card
sso.service.url=http://localhost:8082
#sam.service.url=https://tonda-saccharic-anciently.ngrok-free.dev/prepaid-sam/v1

logging.structured.format.console=ecs

# Feign client configuration for tests
feign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:5000}
feign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:10000}
feign.client.config.default.logger-level=basic

# Logging configuration for tests
logging.level.ir.rahgozin.card.adapter.security.adapter=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
